<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BirdFrame on the Mac App Store</title>
<link rel="stylesheet" href="../style.css">
<script src="../track.js"></script>
</head>
<body>
<div class="wrap" style="padding-block:80px">
  <p class="lede">Opening the Mac App Store… <a id="go" href="https://apps.apple.com/app/birdframe/id6754513569">Continue</a></p>
</div>
<script>
  (function () {
    // Windows PCs go to BirdFrame for Windows on the Microsoft Store (cid = this visit's campaign token).
    var win = /Windows/.test(navigator.userAgent) && !/Android|iPhone|iPad|iPod/.test(navigator.userAgent);
    var href = win ? (window.bfMsStoreLink ? bfMsStoreLink('') : 'https://apps.microsoft.com/detail/9PK8KBZ9L7R3')
      : window.bfStoreLink ? bfStoreLink('https://apps.apple.com/app/birdframe/id6754513569') : 'https://apps.apple.com/app/birdframe/id6754513569';
    document.getElementById('go').href = href;
    if (win) document.getElementById('go').parentNode.firstChild.nodeValue = 'Opening the Microsoft Store… ';
    if (window.bfSend) bfSend('app_store_click', { target: win ? 'ms_get_page' : 'get_page' });
    setTimeout(function () { location.replace(href); }, 300);
  })();
</script>
</body>
</html>
